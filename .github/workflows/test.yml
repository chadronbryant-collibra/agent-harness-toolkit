name: Portable core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python toolkit.py self-check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'toolkit starter.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'toolkit starter'
          python scripts/package.py --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          & (Join-Path $folder 'bootstrap.ps1') self-check
  semantic:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check paraphrased recall with a real local model
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/toolkit-semantic.XXXXXX")"
          curl -fLsS --max-time 180 --retry 2 \
            https://github.com/ollama/ollama/releases/download/v0.40.16/ollama-darwin.tgz \
            --output "$work/ollama.tgz"
          printf '%s  %s\n' a743717494315da7cd352982b805f6b992d4b4452ca117fd5fbf86c4ee46fca0 "$work/ollama.tgz" |
            shasum -a 256 -c -
          mkdir "$work/bin"
          tar -xzf "$work/ollama.tgz" -C "$work/bin"
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_NO_CLOUD=1
          export OLLAMA_MODELS="$work/models"
          "$work/bin/ollama" serve > "$work/server.log" 2>&1 &
          runtime=$!
          trap 'kill "$runtime" 2>/dev/null || true; wait "$runtime" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            kill -0 "$runtime"
            sleep 1
          done
          grep -Fq 'Ollama cloud disabled: true' "$work/server.log"
          "$work/bin/ollama" pull all-minilm:latest
          python scripts/package.py --output "$work/candidate.zip"
          python -m zipfile -e "$work/candidate.zip" "$work/download"
          python "$work/download/tests/semantic_canary.py"
